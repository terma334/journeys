<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-labelledby="title desc">
  <title id="title">Historische Kompassrose</title>
  <desc id="desc">Eine fein gezeichnete sechzehnstrahlige Kompassrose in warmem Goldbraun.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#806033"/>
      <stop offset="0.5" stop-color="#b08a4b"/>
      <stop offset="1" stop-color="#6d512c"/>
    </linearGradient>
    <g id="longPoint">
      <path d="M250 48 L270 225 L250 250 L230 225 Z" fill="url(#gold)" stroke="#76582f" stroke-width="1.5"/>
      <path d="M250 48 L250 250 L230 225 Z" fill="#e1c58b" opacity=".78"/>
    </g>
    <g id="shortPoint">
      <path d="M250 91 L261 235 L250 250 L239 235 Z" fill="#a9854b" stroke="#76582f" stroke-width="1.2"/>
      <path d="M250 91 L250 250 L239 235 Z" fill="#ead7aa" opacity=".8"/>
    </g>
  </defs>

  <g fill="none" stroke="url(#gold)" stroke-linecap="round">
    <circle cx="250" cy="250" r="218" stroke-width="3"/>
    <circle cx="250" cy="250" r="207" stroke-width="1.3"/>
    <circle cx="250" cy="250" r="178" stroke-width="1.2"/>
    <circle cx="250" cy="250" r="154" stroke-width="1" stroke-dasharray="2 7"/>
  </g>

  <!-- 8 Haupt- und Zwischenrichtungen -->
  <use href="#longPoint"/>
  <use href="#longPoint" transform="rotate(45 250 250)"/>
  <use href="#longPoint" transform="rotate(90 250 250)"/>
  <use href="#longPoint" transform="rotate(135 250 250)"/>
  <use href="#longPoint" transform="rotate(180 250 250)"/>
  <use href="#longPoint" transform="rotate(225 250 250)"/>
  <use href="#longPoint" transform="rotate(270 250 250)"/>
  <use href="#longPoint" transform="rotate(315 250 250)"/>

  <!-- 8 kürzere Nebenrichtungen -->
  <use href="#shortPoint" transform="rotate(22.5 250 250)"/>
  <use href="#shortPoint" transform="rotate(67.5 250 250)"/>
  <use href="#shortPoint" transform="rotate(112.5 250 250)"/>
  <use href="#shortPoint" transform="rotate(157.5 250 250)"/>
  <use href="#shortPoint" transform="rotate(202.5 250 250)"/>
  <use href="#shortPoint" transform="rotate(247.5 250 250)"/>
  <use href="#shortPoint" transform="rotate(292.5 250 250)"/>
  <use href="#shortPoint" transform="rotate(337.5 250 250)"/>

  <!-- feine Orientierungslinien -->
  <g stroke="#89683a" stroke-width="1.3" opacity=".9">
    <path d="M250 32 V468 M32 250 H468"/>
    <path d="M96 96 L404 404 M404 96 L96 404"/>
  </g>

  <!-- Zentrum -->
  <circle cx="250" cy="250" r="35" fill="#f0dfb8" stroke="#76582f" stroke-width="2"/>
  <circle cx="250" cy="250" r="27" fill="none" stroke="#a9854b" stroke-width="1.4"/>
  <path d="M250 218 L260 250 L250 282 L240 250 Z" fill="url(#gold)" stroke="#76582f" stroke-width="1"/>
  <path d="M218 250 L250 240 L282 250 L250 260 Z" fill="#ead7aa" stroke="#76582f" stroke-width="1"/>
  <circle cx="250" cy="250" r="5" fill="#76582f"/>

  <!-- Himmelsrichtungs-Buchstaben -->
  <g fill="#76582f" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" text-anchor="middle">
    <text x="250" y="22">N</text>
    <text x="478" y="257">E</text>
    <text x="250" y="493">S</text>
    <text x="22" y="257">W</text>
  </g>
  <g fill="#8e7044" font-family="Georgia, 'Times New Roman', serif" font-size="12" text-anchor="middle">
    <text x="250" y="65">N</text>
    <text x="435" y="254">E</text>
    <text x="250" y="447">S</text>
    <text x="65" y="254">W</text>
  </g>
</svg>
